name: Deploy zenCode to AWS

on:
  push:
    branches:
      - main # This triggers the action when you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- 1. BUILD FRONTEND ---
      - name: Setup Node for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create Frontend Env File
        working-directory: ./frontend
        run: |
          echo "VITE_API_URL=https://zencode.site/api" >> .env
          echo "VITE_SOCKET_URL=https://zencode.site" >> .env

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # --- 2. BUILD BACKEND ---
      - name: Setup Node for Backend
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      # --- 3. DEPLOY VIA SSH & RSYNC ---
      - name: Deploy to AWS EC2
        uses: easingthemes/ssh-deploy@v4.1.8
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          REMOTE_HOST: ${{ secrets.AWS_HOST }}
          REMOTE_USER: ${{ secrets.AWS_USERNAME }}
          # Exclude node_modules to make transfer faster
          EXCLUDE: "/node_modules/, /.git/, /frontend/node_modules/, /backend/node_modules/, /frontend/src/, /backend/src/"
          TARGET: "/home/ubuntu/zencode"
          SOURCE: "./"

      # --- 4. RESTART SERVER & MOVE FRONTEND ---
      - name: Restart PM2 and Nginx Services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Update Backend dependencies on server (fast, since no build required)
            cd /home/ubuntu/zencode/backend
            npm ci --omit=dev
            
            # 2. Restart PM2 Backend
            pm2 restart zencode-api
            pm2 save
            
            # 3. Move newly built frontend to Nginx folder
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/zencode/frontend/dist/* /var/www/html/
            
            # 4. Reload Nginx just in case
            sudo systemctl reload nginx
